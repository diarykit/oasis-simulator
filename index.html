<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠洲生態圈 Oasis Simulator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-blue: #38bdf8;
            --accent-yellow: #facc15;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-green);
        }

        .day-badge {
            background-color: #334155;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #334155;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-sub);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .stat-value {
            font-weight: bold;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: #334155;
            color: var(--text-main);
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #475569;
        }

        button.primary {
            background-color: var(--accent-green);
            color: #000;
            grid-column: span 2;
            padding: 12px;
            font-size: 1rem;
            margin-top: 15px;
        }

        button.primary:hover {
            background-color: #4ade80;
        }

        .log-box {
            grid-column: span 2;
            background-color: #020617;
            border-radius: 8px;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-sub);
            border: 1px solid #334155;
        }

        @media (max-width: 640px) {
            .log-box {
                grid-column: span 1;
            }
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-event {
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌱 綠洲生態圈 Oasis Simulator</h1>
        <div class="day-badge">第 <span id="day-count">1</span> 天</div>
    </header>

    <div class="grid-layout">
        <!-- 資源狀態 -->
        <div class="card">
            <h2>🌍 環境與資源</h2>
            <div class="stat-row"><span>💧 水資源</span><span class="stat-value" id="water-val">50</span></div>
            <div class="stat-row"><span>☀️ 太陽能</span><span class="stat-value" id="solar-val">50</span></div>
            <div class="stat-row"><span>🪙 生態幣</span><span class="stat-value" id="credits-val">100</span></div>
            <div class="btn-group">
                <button onclick="buyResource('water')">買水 (+20) $10</button>
                <button onclick="buyResource('solar')">升級光照 (+20) $15</button>
            </div>
        </div>

        <!-- 生態物種 -->
        <div class="card">
            <h2>🐾 生態群落</h2>
            <div class="stat-row"><span>🌿 植物</span><span class="stat-value" id="plants-val">20</span></div>
            <div class="stat-row"><span>🐇 草食動物</span><span class="stat-value" id="herbivores-val">5</span></div>
            <div class="stat-row"><span>🦊 肉食動物</span><span class="stat-value" id="carnivores-val">1</span></div>
            <div class="btn-group">
                <button onclick="buySpecies('plants')">+植物 $5</button>
                <button onclick="buySpecies('herbivores')">+草食動物 $15</button>
                <button onclick="buySpecies('carnivores')" style="grid-column: span 2;">+肉食動物 $40</button>
            </div>
        </div>

        <!-- 日誌紀錄 -->
        <div class="log-box" id="log-box">
            <div class="log-entry">系統：綠洲初始化完成。請保持生態平衡！</div>
        </div>

        <!-- 下一天按鈕 -->
        <button class="primary" onclick="nextDay()">進入下一天 ⏩</button>
    </div>
</div>

<script>
    // 遊戲狀態數據
    let gameState = {
        day: 1,
        water: 50,
        solar: 50,
        credits: 100,
        plants: 20,
        herbivores: 5,
        carnivores: 1
    };

    function updateUI() {
        document.getElementById('day-count').innerText = gameState.day;
        document.getElementById('water-val').innerText = gameState.water;
        document.getElementById('solar-val').innerText = gameState.solar;
        document.getElementById('credits-val').innerText = gameState.credits;
        document.getElementById('plants-val').innerText = gameState.plants;
        document.getElementById('herbivores-val').innerText = gameState.herbivores;
        document.getElementById('carnivores-val').innerText = gameState.carnivores;
    }

    function addLog(text, isEvent = false) {
        const logBox = document.getElementById('log-box');
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (isEvent ? ' log-event' : '');
        entry.innerText = `[第 ${gameState.day} 天]${text}`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function buyResource(type) {
        if (type === 'water' && gameState.credits >= 10) {
            gameState.credits -= 10;
            gameState.water += 20;
            addLog("購買了水資源 +20");
        } else if (type === 'solar' && gameState.credits >= 15) {
            gameState.credits -= 15;
            gameState.solar += 20;
            addLog("升級了太陽能設施 +20");
        } else {
            addLog("生態幣不足！");
        }
        updateUI();
    }

    function buySpecies(type) {
        if (type === 'plants' && gameState.credits >= 5) {
            gameState.credits -= 5;
            gameState.plants += 5;
            addLog("引進了植物 +5");
        } else if (type === 'herbivores' && gameState.credits >= 15) {
            gameState.credits -= 15;
            gameState.herbivores += 1;
            addLog("引進了草食動物 +1");
        } else if (type === 'carnivores' && gameState.credits >= 40) {
            gameState.credits -= 40;
            gameState.carnivores += 1;
            addLog("引進了肉食動物 +1");
        } else {
            addLog("生態幣不足！");
        }
        updateUI();
    }

    function triggerRandomEvent() {
        const events = [
            { name: "旱災襲來！", effect: () => { gameState.water = Math.max(0, gameState.water - 30); } },
            { name: "陽光普照！", effect: () => { gameState.solar += 25; } },
            { name: "植物病蟲害！", effect: () => { gameState.plants = Math.floor(gameState.plants * 0.6); } },
            { name: "生態補助款發放！", effect: () => { gameState.credits += 30; } }
        ];

        if (Math.random() < 0.3) { // 30% 機率觸發事件
            const evt = events[Math.floor(Math.random() * events.length)];
            evt.effect();
            addLog(`⚠️ 突發事件：${evt.name}`, true);
        }
    }

    function nextDay() {
        gameState.day += 1;

        // 1. 資源消耗與植物成長
        let waterConsumed = Math.min(gameState.water, Math.ceil(gameState.plants * 0.5));
        let solarConsumed = Math.min(gameState.solar, Math.ceil(gameState.plants * 0.3));
        
        gameState.water -= waterConsumed;
        gameState.solar -= solarConsumed;

        // 植物成長受限於獲得的資源
        let plantGrowth = Math.min(waterConsumed * 2, solarConsumed * 3);
        gameState.plants += plantGrowth;

        // 2. 草食動物進食與繁殖/死亡
        let plantFoodNeeded = gameState.herbivores * 2;
        if (gameState.plants >= plantFoodNeeded) {
            gameState.plants -= plantFoodNeeded;
            // 食物充足，少量繁殖
            if (gameState.herbivores > 0 && gameState.day % 2 === 0) {
                gameState.herbivores += Math.floor(gameState.herbivores * 0.2);
            }
        } else {
            // 食物不足，部分餓死
            let starved = Math.ceil((plantFoodNeeded - gameState.plants) / 2);
            gameState.plants = 0;
            gameState.herbivores = Math.max(0, gameState.herbivores - starved);
            addLog(`食物不足，${starved} 只草食動物餓死。`);
        }

        // 3. 肉食動物進食與繁殖/死亡
        let meatFoodNeeded = gameState.carnivores * 2;
        if (gameState.herbivores >= meatFoodNeeded) {
            gameState.herbivores -= meatFoodNeeded;
            if (gameState.carnivores > 0 && gameState.day % 3 === 0) {
                gameState.carnivores += 1;
            }
        } else {
            let starved = Math.ceil((meatFoodNeeded - gameState.herbivores) / 2);
            gameState.herbivores = 0;
            gameState.carnivores = Math.max(0, gameState.carnivores - starved);
            addLog(`獵物不足，${starved} 只肉食動物餓死。`);
        }

        // 4. 自然基礎資源恢復與生態獎勵
        gameState.water += 10;
        gameState.solar += 10;

        // 生態平衡獎勵（三種物種均存在）
        if (gameState.plants > 0 && gameState.herbivores > 0 && gameState.carnivores > 0) {
            let reward = 10 + Math.floor((gameState.plants + gameState.herbivores + gameState.carnivores) / 5);
            gameState.credits += reward;
            addLog(`生態維持平衡，獲得 $${reward} 生態獎勵。`);
        }

        // 5. 隨機事件
        triggerRandomEvent();

        updateUI();
    }

    // 初始化介面
    updateUI();
</script>

</body>
</html>
